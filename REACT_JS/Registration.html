<html>
    <head>
        <title>Registration Form</title>
    </head>
    <body>
        <style>
            h1{text-align: center;
                color: black;}

            form{
                max-width:700px;
                margin:auto;
                padding:25px;
                border-radius: 20px;
                background-color: aliceblue;
            }
        </style>
        <h1>REGISTRATION FORM </h1>
        <form>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" required/><br><br>
   
            <label for="dateofbirth">Date Of Birth:</label>
            <input type="date" id="dateofbirth" name="dob" min="2000-01-01" max="2010-12-31" required/><br><br>
 
            <label>Gender</label><br>
            <input type="radio" id="male" name="gender" value="MALE"/>
            <label for="male">Male</label><br>
            
            <input type="radio" id="female" name="gender" value="FEMALE"/>
            <label for="male">Female</label><br>
            
            <input type="radio" id="others" name="gender" value="others"/>
            <label for="male">Others</label><br><br>
 
            <label for="fathersname">Father Name</label>
            <input type="text" id="fathername" name="fathername" required/><br><br>
            
            <label for="ssc percentage">SSC/10th percentage</label>
            <input type="number" id="ssc percentage" name="ssc percentage" min="0" max="100" step="0.2" required/>%
           
            <label for="intermediate">Intermediate percentage</label>
            <input type="number" id="intermediate" name="intermediate" min="0" max="100" step="0.2" required/>%<br><br>
           
            <label for="B-tech">B-tech</label>
           <select id="branch" name="branch" required>Branch
           <option value="">--SELECT OPTION--</option> 
           <option value="cse">CSE</option>
           <option value="csd">CSD</option>  
           <option value="csm">CSM</option>
           <option value="ece">ECE</option>
           </select>

           <label for="cgpa">CGPA</label>
            <input type="number" id="cgpa" name="cgpa" min="0" max="100" step="0.2" required/>%<br><br>

           <label for="city">City</label>
           <select id="city" name="city" required>
           <option value="">--SELECT OPTION--</option> 
           <option value="city">Vepagunta</option>
           <option value="city>Gajuwaka</option>  
           <option value="city">Viskhapatanam</option>
           <option value="city">Pendruthi</option>
           </select><br><br>
           
           <label for="fatherinfo"> Fathers Occupation </label>
           <input typr="text" id="fo" name="fo" required/><br><br>

           <label for="native place">Tell Me About Your Native Place(max 100 words)</label><br>
           <textarea id="native place" name="Native place" rows="5" cols="20" min="10" max="20" required></textarea><br><br>

           <label for="email">Email Address:</label>
           <input type="text" id="email" required><br><br>

           <label for="mobilenumber">MobileNumber:</label><br>
           <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" required/>
           <small>format:10 digits</small><br><br>

           <label for="password">password:</label>
           <input type="password" id="password" name="password" required/><br><br>

           <input type="submit" value="Register"/>
           <input type="clear" value="Clear"/>

        </form>
    </body>
</html>
